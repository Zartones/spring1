databaseChangeLog:
  - changeSet:
      id: assign-admin
      author: zartones
      changes:
        - sql:
            sql: |
              INSERT INTO users_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              JOIN roles r ON r.name = 'ROLE_ADMIN'
              WHERE u.id = (
                  SELECT id FROM users ORDER BY id LIMIT 1
              )
              AND NOT EXISTS (
                  SELECT 1
                  FROM users_roles ur
                  WHERE ur.user_id = u.id
                  AND ur.role_id = r.id
              ); 
