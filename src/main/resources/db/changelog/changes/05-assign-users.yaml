databaseChangeLog:
  - changeSet:
      id: assign-user
      author: zartones
      changes:
        - sql:
            sql: |
              INSERT INTO users_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              JOIN roles r ON r.name = 'ROLE_USER'
              WHERE NOT EXISTS (
                  SELECT 1
                  FROM users_roles ur
                  WHERE ur.user_id = u.id
                  AND ur.role_id = r.id
              );
              
